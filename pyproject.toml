[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eblook-mcp"
dynamic = ["version"]
description = "MCP server that provides dictionary services via eblook"
requires-python = ">=3.10"
dependencies = [
    "pexpect>=4.8",
    "Pillow>=9.0",
    "tomli>=2.0; python_version < '3.11'",
    "fastmcp>=2.0",
]

[project.scripts]
eblook-mcp = "eblook_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "mcp>=2.3",
    "mypy>=1.10",
    "types-pexpect>=4.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the eblook command and real dictionaries",
]

[tool.setuptools]
packages = ["eblook_mcp"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "eblook_mcp.__version__" }
